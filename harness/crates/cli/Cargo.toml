[package]
name = "autoinference"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agentic CLI for LLM inference optimization on NVIDIA GPUs: engine selection, config tuning, kernel synthesis, validation."
readme = "../../README.md"
keywords = ["llm", "inference", "vllm", "sglang", "agent"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "autoinference"
path = "src/main.rs"

[dependencies]
autoinference-protocol = { path = "../protocol", version = "0.0.3" }
autoinference-core = { path = "../core", version = "0.0.3" }
autoinference-agent = { path = "../agent", version = "0.0.3" }
autoinference-tui = { path = "../tui", version = "0.0.3" }
anyhow.workspace = true
tokio.workspace = true
clap.workspace = true
serde_json.workspace = true
schemars.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
