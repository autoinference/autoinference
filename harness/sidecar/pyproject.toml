[project]
name = "autoinference-sidecar"
version = "0.0.5"
description = "Out-of-process Python sidecar for autoinference: knob-registry queries, hardware probes, engine adapters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Auto Inference", email = "hello@autoinference.org" }]
keywords = ["autoinference", "inference", "vllm", "sglang", "gpu"]
dependencies = ["cbor2>=5.6"]

[project.optional-dependencies]
engines = ["optuna>=3.6", "numpy>=1.26"]

[project.urls]
Homepage = "https://autoinference.org"
Repository = "https://github.com/autoinference/autoinference"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autoinference_sidecar*"]
