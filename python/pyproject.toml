[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoinference"
version = "0.0.6"
description = "Agentic LLM inference optimization on NVIDIA GPUs: engine selection, config tuning, kernel synthesis, validation. Python umbrella package (installs the sidecar; the CLI is a Rust binary)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Auto Inference", email = "hello@autoinference.org" }]
keywords = ["autoinference", "inference", "llm", "vllm", "sglang", "tensorrt-llm", "gpu", "agent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["autoinference-sidecar>=0.0.5"]

[project.scripts]
autoinference-py = "autoinference.__main__:main"

[project.urls]
Homepage = "https://autoinference.org"
Repository = "https://github.com/autoinference/autoinference"
Issues = "https://github.com/autoinference/autoinference/issues"
